name: AI Resource Auto Merge

on:
  workflow_run:
    workflows: [PR Validation]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-resource-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: node .yarn/releases/yarn-1.22.19.cjs install --frozen-lockfile --non-interactive

      - name: Record trusted main revision
        id: trusted-main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Strictly validate and squash merge AI resource PR
        env:
          AUTO_MERGE_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          AUTO_MERGE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AUTO_MERGE_WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          AUTO_MERGE_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          AUTO_MERGE_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          AUTO_MERGE_TRUSTED_MAIN_SHA: ${{ steps.trusted-main.outputs.sha }}
          CNMCP_BOT_TOKEN: ${{ secrets.CNMCP_BOT_TOKEN }}
        run: node scripts/auto-merge-resource-pr.mjs
